baseURL = 'https://cdn.enochyu.com/'
title = 'Enoch Yu - CDN'
locale = 'en-us'

enableRobotsTXT = true
disableKinds = ["taxonomy"]

[params]
  author = "Enoch Yu"

[outputFormats.index]
  mediaType = "text/plain"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "index"]

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../A/pdf"
    target = "static/a/pdf"
  [[module.mounts]]
    source = "../C/pdf"
    target = "static/c/pdf"

